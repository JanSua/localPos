name: nodedr-pos

services:
  db:
    image: postgres:17-alpine
    container_name: nodedr-pos-db
    hostname: db
    restart: unless-stopped

    environment:
      POSTGRES_DB: nodedrpos
      POSTGRES_USER: nodedr
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

    networks:
      - nodedr-pos

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: localpos-backend:latest
    container_name: nodedr-pos-backend
    hostname: nodedr-pos-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: "postgresql://nodedr:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/nodedrpos?schema=public"
      PORT: "4000"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:1994}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"

    expose:
      - "4000"

    volumes:
      - app_data:/app/data
      - /dev/bus/usb:/dev/bus/usb

    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 180:* rmw"

    networks:
      - nodedr-pos

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:4000
    image: localpos-frontend:latest
    container_name: nodedr-pos-frontend
    hostname: nodedr-pos-frontend
    restart: unless-stopped

    ports:
      - "1994:3000"

    depends_on:
      - backend

    networks:
      - nodedr-pos

  caddy:
    image: caddy:2-alpine
    container_name: nodedr-pos-caddy
    restart: unless-stopped

    profiles:
      - https

    ports:
      - "${HTTPS_PORT:-443}:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

    depends_on:
      - frontend

    networks:
      - nodedr-pos

  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: nodedr-pos-cloudflared-quick
    restart: unless-stopped

    profiles:
      - cloudflare-quick

    command:
      - tunnel
      - --url
      - http://frontend:3000

    depends_on:
      - frontend

    networks:
      - nodedr-pos

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nodedr-pos-cloudflared
    restart: unless-stopped

    profiles:
      - cloudflare

    command:
      - tunnel
      - run
      - --token
      - "${CLOUDFLARE_TUNNEL_TOKEN:-}"

    depends_on:
      - frontend

    networks:
      - nodedr-pos


networks:
  nodedr-pos:
    driver: bridge


volumes:
  app_data:
  postgres_data:
  caddy_data: