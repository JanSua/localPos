name: nodedr-pos

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: localpos-backend:latest
    container_name: nodedr-pos-backend
    hostname: nodedr-pos-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: "file:/app/data/pos.db"
      PORT: "4000"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-http://localhost:1994}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"

    expose:
      - "4000"

    volumes:
      - data:/app/data
      - /dev/bus/usb:/dev/bus/usb

    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 180:* rmw"

    networks:
      - nodedr-pos

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:4000
    image: localpos-frontend:latest
    container_name: nodedr-pos-frontend
    hostname: nodedr-pos-frontend
    restart: unless-stopped

    ports:
      - "1994:3000"

    depends_on:
      - backend

    networks:
      - nodedr-pos

  sqlite-web:
    image: ghcr.io/coleifer/sqlite-web:latest
    container_name: nodedr-pos-sqlite-web
    restart: unless-stopped

    profiles:
      - db

    command:
      - sqlite_web
      - -H
      - 0.0.0.0
      - -p
      - "8080"
      - /data/pos.db

    ports:
      - "18743:8080"

    volumes:
      - data:/data

    depends_on:
      - backend

    networks:
      - nodedr-pos

  caddy:
    image: caddy:2-alpine
    container_name: nodedr-pos-caddy
    restart: unless-stopped

    profiles:
      - https

    ports:
      - "${HTTPS_PORT:-443}:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

    depends_on:
      - frontend

    networks:
      - nodedr-pos

  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: nodedr-pos-cloudflared-quick
    restart: unless-stopped

    profiles:
      - cloudflare-quick

    command:
      - tunnel
      - --url
      - http://frontend:3000

    depends_on:
      - frontend

    networks:
      - nodedr-pos

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nodedr-pos-cloudflared
    restart: unless-stopped

    profiles:
      - cloudflare

    command:
      - tunnel
      - run
      - --token
      - "${CLOUDFLARE_TUNNEL_TOKEN:-}"

    depends_on:
      - frontend

    networks:
      - nodedr-pos


networks:
  nodedr-pos:
    driver: bridge


volumes:
  data:
  caddy_data: