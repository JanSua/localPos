name: nodedr-pos

services:
  db:
    image: postgres:17-alpine
    container_name: nodedr-pos-db
    hostname: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nodedrpos
      POSTGRES_USER: nodedr
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - nodedr-pos
    x-casaos:
      envs:
        - container: POSTGRES_PASSWORD
          description:
            en_US: Set a strong password using letters and numbers; keep it safe for PostgreSQL administration and backups.
      volumes:
        - container: /var/lib/postgresql/data
          description:
            en_US: Persistent PostgreSQL database files. Back up this data using pg_dump, not by copying the live files.

  backend:
    image: ghcr.io/raktim94/nodedr-pos-backend:develop
    container_name: nodedr-pos-backend
    hostname: nodedr-pos-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://nodedr:${POSTGRES_PASSWORD:?Set a strong PostgreSQL password}@db:5432/nodedrpos?schema=public"
      PORT: "4000"
      FRONTEND_ORIGIN: "http://localhost:1994"
      COOKIE_SECURE: "false"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /app/data
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rmw"
      - "c 180:* rmw"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nodedr-pos
    x-casaos:
      envs:
        - container: FRONTEND_ORIGIN
          description:
            en_US: Origin allowed to call the API. Change this for a VPS behind HTTPS.
        - container: COOKIE_SECURE
          description:
            en_US: Set to true only when served over real HTTPS.
      volumes:
        - container: /app/data
          description:
            en_US: Persistent session-signing secret.
        - container: /dev/bus/usb
          description:
            en_US: USB passthrough for optional direct-USB thermal receipt printing.

  frontend:
    image: ghcr.io/raktim94/nodedr-pos-frontend:develop
    container_name: nodedr-pos-frontend
    hostname: nodedr-pos-frontend
    restart: unless-stopped
    ports:
      - target: 3000
        published: "1994"
        protocol: tcp
    depends_on:
      - backend
    networks:
      - nodedr-pos
    x-casaos:
      ports:
        - container: "3000"
          description:
            en_US: NodeDR POS web interface
          protocol: tcp

networks:
  nodedr-pos:
    driver: bridge

x-casaos:
  id: com.nodedr.pos
  architectures:
    - amd64
    - arm64
  main: frontend
  author: NodeDR Infotech Private Limited
  developer: Raktim94
  category: Finance
  icon: https://cdn.jsdelivr.net/gh/Raktim94/nodedr-pos@master/casaos/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/Raktim94/nodedr-pos@master/casaos/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/Raktim94/nodedr-pos@master/casaos/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/Raktim94/nodedr-pos@master/casaos/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/Raktim94/nodedr-pos@master/casaos/screenshot-3.png
  title:
    en_US: NodeDR POS
  tagline:
    en_US: Offline-first point of sale and inventory for small retail shops
  description:
    en_US: |
      NodeDR POS is a free, open-source, offline-first Point of Sale and
      inventory management system for small retail shops. No subscription,
      no internet connection required, no data ever leaving your home
      server — it's built to run on your own hardware and stay there.

      Access it from any device on your home network at
      `http://<your-server>:1994`.
  tips:
    before_install:
      en_US: |
        Set a strong PostgreSQL password during installation. The database
        is available to the app over its private container network; its host
        port is bound to localhost only.

        On first launch you'll create an admin account and set up your shop.
        Optional: direct-USB thermal receipt printing uses the bundled
        `/dev/bus/usb` passthrough.
  index: /
  scheme: http
  port_map: "1994"
  version: "1.2.0-dev"
  update_at: "2026-10-07"
  release_notes:
    en_US: |-
      Development preview: application data now uses PostgreSQL.
  website: "https://www.nodedr.com"
  repo: "https://github.com/Raktim94/nodedr-pos"
  support: "https://github.com/Raktim94/nodedr-pos/issues"
  docs: "https://github.com/Raktim94/nodedr-pos#readme"
